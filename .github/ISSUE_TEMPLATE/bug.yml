name: Bug report
description: The skill did something wrong or a check gave a wrong result.
labels: ["bug"]
body:
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.x, Cursor, Codex CLI, ...
    validations:
      required: true
  - type: input
    id: skill_version
    attributes:
      label: Skill version
      description: The `metadata.version` in SKILL.md.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: asked
    attributes:
      label: What you asked
      description: The prompt, and whether it was a build, a polish, or an audit.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: Audit output
      description: Paste the output of `audit.mjs`, if it ran. Remove anything private.
      render: text
