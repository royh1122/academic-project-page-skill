name: Validate Agent Skill

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22 (audit.mjs uses the built-in WebSocket)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontmatter is strict YAML; versions and manifests agree
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import json, os, yaml

          class Strict(yaml.SafeLoader):
              """SafeLoader that fails on duplicate keys, which plain YAML silently overwrites."""
          def mapping(loader, node, deep=False):
              keys = [loader.construct_object(k, deep=deep) for k, _ in node.value]
              dupes = {k for k in keys if keys.count(k) > 1}
              assert not dupes, f'duplicate frontmatter keys: {dupes}'
              return yaml.SafeLoader.construct_mapping(loader, node, deep)
          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, mapping)

          text = open('skills/academic-project-page/SKILL.md', encoding='utf-8').read()
          assert text.startswith('---\n'), 'SKILL.md must open with the frontmatter'
          meta = yaml.load(text.split('---\n')[1], Loader=Strict)
          assert meta['name'] == 'academic-project-page', meta.get('name')
          assert 0 < len(meta['description']) <= 1024, len(meta['description'])
          version = meta['metadata']['version']
          assert isinstance(version, str), 'metadata.version must be a quoted string'

          # Size budget (MAINTAINING.md): SKILL.md loads on every trigger, so it stays short.
          body = text.split('---\n', 2)[2]
          words, longest = len(body.split()), max(len(line) for line in body.splitlines())
          assert words <= 2500, f'SKILL.md body is {words} words; the budget is 2500 (move detail to a reference)'
          assert longest <= 700, f'a SKILL.md line is {longest} characters; split it (limit 700)'
          if words > 2200:
              print(f'::warning file=skills/academic-project-page/SKILL.md::SKILL.md body is {words} words, near the 2500 budget')

          claude = json.load(open('.claude-plugin/marketplace.json', encoding='utf-8'))
          codex_market = json.load(open('.agents/plugins/marketplace.json', encoding='utf-8'))
          versions = {'SKILL.md': version}
          for plugin in claude['plugins']:
              versions[f'.claude-plugin/marketplace.json ({plugin["name"]})'] = plugin.get('version')
              for skill in plugin.get('skills', []):
                  path = os.path.join(plugin['source'], skill, 'SKILL.md')
                  assert os.path.isfile(path), f'Claude marketplace lists {skill}, but {path} is missing'
          for plugin in codex_market['plugins']:
              root = plugin['source']['path']
              manifest = json.load(open(os.path.join(root, '.codex-plugin', 'plugin.json'), encoding='utf-8'))
              versions[f'{root}/.codex-plugin/plugin.json'] = manifest.get('version')
              path = os.path.join(root, manifest['skills'], 'SKILL.md')
              assert os.path.isfile(path), f'Codex plugin lists {manifest["skills"]}, but {path} is missing'
          assert len(set(versions.values())) == 1, 'versions differ: ' + ', '.join(f'{k} {v}' for k, v in versions.items())
          print('frontmatter ok:', len(meta['description']), 'description chars; version', version, 'in', len(versions), 'files;', words, 'words in SKILL.md')
          PY

      - name: Validate Skill Structure & Frontmatter
        run: |
          echo "Checking skill payload directory..."
          test -d "skills/academic-project-page" || (echo "Missing skills/academic-project-page directory" && exit 1)
          test -f "skills/academic-project-page/SKILL.md" || (echo "Missing SKILL.md" && exit 1)
          test -f "skills/academic-project-page/template/index.html" || (echo "Missing template/index.html" && exit 1)
          test -d "skills/academic-project-page/static" || (echo "Missing static assets" && exit 1)

          echo "Validating SKILL.md YAML frontmatter..."
          # Check for YAML frontmatter markers
          head -n 1 skills/academic-project-page/SKILL.md | grep -q -- "^---" || (echo "SKILL.md missing frontmatter header" && exit 1)
          grep -q "name: academic-project-page" skills/academic-project-page/SKILL.md || (echo "Missing skill name" && exit 1)
          grep -q "description:" skills/academic-project-page/SKILL.md || (echo "Missing skill description" && exit 1)

          echo "Verifying no root-absolute URLs in template..."
          ! grep -E 'href="/static|src="/static' skills/academic-project-page/template/index.html || (echo "Found root-absolute static path in template" && exit 1)

          echo "Verifying the template uses inline SVG icons, not icon-font markup..."
          ! grep -nE '<i class="(fas|fab|far|ai) ' skills/academic-project-page/template/index.html skills/academic-project-page/static/js/*.js || (echo "Icon-font markup found; use references/icons.md" && exit 1)

          echo "Checking bundled scripts parse..."
          for f in skills/academic-project-page/static/js/index.js skills/academic-project-page/static/js/figure-viewer.js skills/academic-project-page/static/js/reduced-motion.js skills/academic-project-page/scripts/audit.mjs skills/academic-project-page/scripts/lib/chrome.mjs; do node --check "$f" || exit 1; done
          python3 -c "import json; d = json.load(open('evals/evals.json')); assert d['evals'], 'no evals'"
          # audit_page.js and check_style.js are Playwright function expressions, not modules.
          for f in skills/academic-project-page/scripts/audit_page.js skills/academic-project-page/scripts/check_style.js; do
            node -e "new Function('return ' + require('fs').readFileSync('$f', 'utf8'))" || exit 1
          done
          python3 -m py_compile skills/academic-project-page/scripts/preview_server.py skills/academic-project-page/scripts/unused_assets.py skills/academic-project-page/scripts/check_numbers.py skills/academic-project-page/scripts/check_links.py

          echo "Checking referenced bundle files exist..."
          for f in references/layout-polish.md references/style-fidelity.md references/theme-profile.json static/css/figure-viewer.css static/js/figure-viewer.js scripts/audit.mjs scripts/lib/chrome.mjs scripts/check_numbers.py scripts/check_links.py references/icons.md; do
            test -f "skills/academic-project-page/$f" || (echo "Missing $f" && exit 1)
          done

          echo "Validation passed successfully!"
